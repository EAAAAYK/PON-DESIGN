    <main class="contact-page">
      <div class="container">
        <span class="contact-first-message"
          >Webサイトの制作のご依頼やお見積りなど、お気軽にご相談ください。</span
        >
        <div class="contact-wrapper">
          <form class="contact-form" action="" method="post">
            <!-- お問い合わせ種別 -->
            <fieldset style="border: none; padding: 0; margin: 0">
              <legend class="contact-label">
                お問い合わせ種別<span class="contact-required">*必須</span>
              </legend>
              <div class="radio-wrapper">
                <label>
                  <input
                    type="radio"
                    name="subject"
                    value="お仕事のご依頼・ご相談"
                    checked
                  />お仕事のご依頼・ご相談</label
                >
                <label>
                  <input
                    type="radio"
                    name="subject"
                    value="お見積りのご依頼"
                  />お見積りのご依頼
                </label>
                <label>
                  <input
                    type="radio"
                    name="subject"
                    value="採用について"
                  />採用について
                </label>
                <label>
                  <input type="radio" name="subject" value="その他" />その他
                </label>
              </div>
            </fieldset>
            <!-- お名前 -->
            <div>
              <label class="contact-label" for="name"
                >お名前<span class="contact-required">*必須</span></label
              >
              <input
                class="input-text"
                type="text"
                name="name"
                id="name"
                required
              />
            </div>
            <!-- 会社名 -->
            <div>
              <label class="contact-label" for="company-name"
                >会社名<span class="contact-required">*必須</span></label
              >
              <input
                class="input-text"
                type="text"
                name="company-name"
                id="company-name"
                required
              />
            </div>
            <!-- メールアドレス -->
            <div>
              <label class="contact-label" for="mail"
                >メールアドレス<span class="contact-required"
                  >*必須</span
                ></label
              >
              <input
                class="input-text"
                type="email"
                name="mail"
                id="mail"
                required
              />
            </div>
            <!-- 電話番号 -->
            <div>
              <label class="contact-label" for="tel"
                >電話番号<span class="contact-additionalNote"
                  >（半角数字ハイフンなし）</span
                ></label
              >
              <input class="input-tel" name="tel" id="tel" type="tel" />
            </div>
            <!-- お問い合わせ内容 -->
            <div>
              <label class="contact-label" for="message"
                >お問い合わせ内容</label
              >
              <textarea
                class="textarea"
                name="message"
                id="message"
                placeholder="お問い合わせ内容を具体的にご記入くださいませ。"
              ></textarea>
            </div>
            <!-- PON DESIGNをどちらでお知りになりましたか？ -->
            <div>
              <label class="contact-label" for="how_did_you_hear"
                >PON DESIGNをどちらでお知りになりましたか？<span
                  class="contact-required"
                  >*必須</span
                ></label
              >
              <select
                class="select"
                name="how_did_you_hear"
                id="how_did_you_hear"
                required
              >
                <option value="">選択してください</option>
                <option value="Google/Yahoo検索">Google/Yahoo検索</option>
                <option value="SNS">SNS</option>
                <option value="ブログ">ブログ</option>
                <option value="友人や知人">友人や知人</option>
                <option value="その他">その他</option>
              </select>
            </div>
            <button class="c-btn btn-purple btn-contactForm" type="submit">
              送信する
            </button>
          </form>
        </div>
      </div>
